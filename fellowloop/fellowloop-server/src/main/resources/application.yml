server:
  port: ${FELLOWLOOP_PORT:8080}
  # behind Nginx / a load balancer: X-Forwarded-For/-Proto are believed only from the proxies listed in
  # FELLOWLOOP_TRUSTED_PROXIES (a regular expression over the peer address; default: this machine only), so a
  # client that reaches the server directly cannot choose the address used for sign-in limits and audit
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${FELLOWLOOP_TRUSTED_PROXIES:127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1}
  shutdown: graceful
spring:
  application:
    name: fellowloop
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FELLOWLOOP_DB_URL:jdbc:h2:file:${user.home}/.fellowloop/server/fellowloop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE}
    username: ${FELLOWLOOP_DB_USER:sa}
    password: ${FELLOWLOOP_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  web:
    resources:
      static-locations: ${FELLOWLOOP_WEB_DIR:classpath:/static/}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  mvc:
    async:
      request-timeout: -1
fellowloop:
  public-url: ${FELLOWLOOP_PUBLIC_URL:http://localhost:8080}
  admin:
    email: ${FELLOWLOOP_ADMIN_EMAIL:admin@fellowloop.local}
    password: ${FELLOWLOOP_ADMIN_PASSWORD:}
    name: ${FELLOWLOOP_ADMIN_NAME:Admin}
  default-timezone: ${FELLOWLOOP_TIMEZONE:Asia/Singapore}
  downloads-dir: ${FELLOWLOOP_DOWNLOADS_DIR:}
  # uploaded attachments (screenshots etc.); back this folder up together with the database
  storage-dir: ${FELLOWLOOP_STORAGE_DIR:${user.home}/.fellowloop/server/files}
  audit:
    retention-days: ${FELLOWLOOP_AUDIT_RETENTION_DAYS:365}
  lease-seconds: 60
  heartbeat-seconds: 15
  http:
    allowed-hosts: ${FELLOWLOOP_HTTP_ALLOWED_HOSTS:}
  notify:
    webhook-url: ${FELLOWLOOP_NOTIFY_WEBHOOK_URL:}
    format: ${FELLOWLOOP_NOTIFY_FORMAT:slack}
logging:
  level:
    dev.fellowloop: INFO
