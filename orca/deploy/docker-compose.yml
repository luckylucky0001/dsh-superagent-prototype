# Self-hosted Orca: PostgreSQL + the server (with the web UI).
#   cp deploy/.env.example deploy/.env   # then edit the passwords and the public URL
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Daemons run on developer or build machines, not in this compose file (see README).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: orca
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: ${ORCA_DB_PASSWORD:?set ORCA_DB_PASSWORD}
    volumes:
      - orca-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORCA_DB_URL: jdbc:postgresql://postgres:5432/orca
      ORCA_DB_USER: orca
      ORCA_DB_PASSWORD: ${ORCA_DB_PASSWORD}
      ORCA_ADMIN_EMAIL: ${ORCA_ADMIN_EMAIL:-admin@orca.local}
      ORCA_ADMIN_PASSWORD: ${ORCA_ADMIN_PASSWORD:?set ORCA_ADMIN_PASSWORD}
      ORCA_PUBLIC_URL: ${ORCA_PUBLIC_URL:-http://localhost:8080}
      ORCA_TIMEZONE: ${ORCA_TIMEZONE:-Asia/Singapore}
      ORCA_HTTP_ALLOWED_HOSTS: ${ORCA_HTTP_ALLOWED_HOSTS:-}
      ORCA_NOTIFY_WEBHOOK_URL: ${ORCA_NOTIFY_WEBHOOK_URL:-}
      ORCA_NOTIFY_FORMAT: ${ORCA_NOTIFY_FORMAT:-slack}
    volumes:
      - orca-files:/var/lib/orca/files   # uploaded attachments; back up with the database
    ports:
      - "${ORCA_HTTP_PORT:-8080}:8080"

volumes:
  orca-db:
  orca-files:
