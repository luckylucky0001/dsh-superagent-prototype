# Mirrors the standalone orca repository's CI, run from the orca/ subfolder.
name: orca-ci
on:
  push:
    paths:
    - orca/**
    - .github/workflows/orca-ci.yml
  pull_request:
    paths:
    - orca/**
    - .github/workflows/orca-ci.yml
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Build and test (offline fakes; live provider tests are excluded)
      env:
        MAVEN_OPTS: -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.interval=3000 -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
      run: mvn -B -q install
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: orca/web/package-lock.json
    - name: Package the release (server with web UI, daemon, CLI, installer)
      run: sh scripts/package.sh
    defaults:
      run:
        working-directory: orca
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orca_e2e
          POSTGRES_USER: orca
          POSTGRES_PASSWORD: orca-test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U orca -d orca_e2e" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: End-to-end tests on PostgreSQL 16
      env:
        MAVEN_OPTS: -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.interval=3000 -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
        ORCA_TEST_DB_URL: jdbc:postgresql://localhost:5432/orca_e2e
        ORCA_TEST_DB_USER: orca
        ORCA_TEST_DB_PASSWORD: orca-test
      run: 'mvn -B -q install -DskipTests

        mvn -B -q test -pl orca-server

        '
    defaults:
      run:
        working-directory: orca
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build the image
      run: docker build -t orca-server:ci .
    - name: Start it and check
      run: 'docker run -d --name orca -p 8080:8080 -e ORCA_ADMIN_PASSWORD=ci-pass-123 orca-server:ci

        for i in $(seq 60); do curl -sf localhost:8080/api/health && break; sleep 2; done

        curl -sf localhost:8080/api/health | grep -q ''"version"''

        curl -sf -o /dev/null localhost:8080/downloads/install-runtime.sh

        curl -sf -o /dev/null localhost:8080/downloads/orca-daemon.jar

        curl -sf -o /dev/null localhost:8080/downloads/orca-cli.jar

        curl -sf localhost:8080/ | grep -q "<title>Orca</title>"

        test "$(docker exec orca id -un)" = orca

        '
    - if: failure()
      run: docker logs orca || true
    defaults:
      run:
        working-directory: orca
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orca/web
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: orca/web/package-lock.json
    - run: npm ci --no-audit --no-fund
    - run: npm run typecheck
    - run: npm run build
