name: orca-ci

on:
  push:
    paths: ["orca/**", ".github/workflows/orca-ci.yml"]
  pull_request:
    paths: ["orca/**", ".github/workflows/orca-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (offline fakes; live provider tests are excluded)
        run: mvn -B -q install

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orca/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orca/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
